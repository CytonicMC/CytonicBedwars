name: Build
run-name: Build by @${{ github.actor }}

on:
  push:
    branches:
      - master

jobs:
  build:
    if: github.repository == 'CytonicMC/Bedwars'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Build Jar
        run: ./gradlew --build-cache --parallel assemble
